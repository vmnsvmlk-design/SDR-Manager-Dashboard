<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDR Manager Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0F141B;
      --card: #1C2330;
      --card-alt: #232C3B;
      --card-hover: #26303F;
      --border: #2C3647;
      --border-strong: #4B6A93;
      --text: #E8ECF2;
      --muted: #8E99AB;
      --faint: #5C6779;
      --blue: #6FA8E8;
      --teal: #5CC3AE;
      --red: #E58080;
      --amber: #E2B054;
      --green: #6CC596;
      --gold-1: #F0DC9A; --gold-2: #CFA83E; --gold-3: #8C6A1F;
      --silver-1: #E6E9EE; --silver-2: #B4BBC6; --silver-3: #6E7682;
      --bronze-1: #E3BC93; --bronze-2: #B98458; --bronze-3: #7A5233;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }
    .app { display: flex; min-height: 100vh; }

    /* ---------- sidebar ---------- */
    .sidebar {
      width: 232px; flex-shrink: 0; background: #151B24; border-right: 1px solid var(--border);
      padding: 24px 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    }
    .brand { font-family: Fraunces, Georgia, serif; font-size: 19px; margin: 0 22px 28px; line-height: 1.25; }
    .brand small { display: block; font-family: Inter, sans-serif; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 22px; cursor: pointer; color: var(--muted);
      font-size: 14px; font-weight: 500; border-left: 3px solid transparent; background: none; border-top: 0; border-right: 0; border-bottom: 0;
      width: 100%; text-align: left;
    }
    .nav-item:hover { color: var(--text); background: rgba(111,168,232,0.05); }
    .nav-item.active { color: var(--text); border-left-color: var(--blue); background: rgba(111,168,232,0.10); }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
    .sidebar-foot { margin-top: auto; padding: 0 22px; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .sidebar-foot button { margin-top: 8px; }

    .main { flex: 1; min-width: 0; padding: 28px 36px 60px; }
    .page { display: none; }
    .page.active { display: block; }

    .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .page-header h2 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 700; }
    .page-header .subtitle { color: var(--muted); font-size: 13px; margin-top: 6px; }

    /* ---------- filters ---------- */
    .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .seg { display: inline-flex; background: var(--card); border-radius: 10px; padding: 3px; border: 1px solid var(--border); }
    .seg button { background: transparent; border: none; color: var(--muted); padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .seg button:hover { color: var(--text); }
    .seg button.active { background: var(--blue); color: #0B1420; font-weight: 600; }
    select.filter-select {
      background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; font-size: 13px; min-width: 170px; font-family: inherit;
    }
    .btn {
      background: var(--card-alt); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 500;
    }
    .btn:hover { border-color: var(--border-strong); }
    .link-btn { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 14px; font-weight: 500; padding: 0; white-space: nowrap; }
    .link-btn:hover { text-decoration: underline; }

    .section-heading { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 4px; }
    .section-heading h3 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 21px; }
    .section-desc { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

    .loading, .error-box, .empty-box { color: var(--muted); font-size: 13px; padding: 28px; text-align: center; }
    .error-box { color: var(--red); }
    .warning-box { background: rgba(226,176,84,0.08); border: 1px solid rgba(226,176,84,0.35); color: var(--amber); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .info-icon {
      display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%;
      border: 1.5px solid var(--blue); color: var(--blue); font-family: Georgia, serif; font-size: 11px; font-style: italic; font-weight: 700;
      cursor: help; position: relative; flex-shrink: 0; vertical-align: middle;
    }
    .info-icon:hover::after {
      content: attr(data-tooltip); position: absolute; top: 135%; left: 50%; transform: translateX(-50%);
      background: #0A0E13; color: var(--text); border: 1px solid var(--border); padding: 9px 11px; border-radius: 8px;
      width: 280px; font-family: Inter, sans-serif; font-size: 12px; font-style: normal; font-weight: 400; line-height: 1.45;
      white-space: normal; z-index: 60; text-align: left; box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }

    /* ---------- leaderboard podium ---------- */
    .podium-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .podium-card {
      background: linear-gradient(180deg, #1F2734 0%, #1B222D 100%); border: 1px solid var(--border-strong);
      border-radius: 18px; padding: 22px 22px 16px; display: flex; flex-direction: column;
    }
    .podium-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .podium-title {
      background: none; border: none; color: var(--text); padding: 0; cursor: pointer; text-align: left;
      font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 700; line-height: 1.2;
      text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 4px; transition: text-decoration-color .15s, color .15s;
    }
    .podium-title:hover { text-decoration-color: currentColor; }
    .podium-title:hover { color: var(--blue); }
    .podium-title .hash { color: var(--muted); font-weight: 600; margin-right: 2px; }
    .podium-sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .region-pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--teal); background: rgba(92,195,174,0.12); border-radius: 999px; padding: 2px 9px; margin-right: 6px; }
    .podium-head .link-btn { font-size: 13px; margin-top: 4px; }

    .podium { display: grid; grid-template-columns: 1fr 1.08fr 1fr; gap: 10px; align-items: end; margin-top: 18px; border-bottom: 1px solid var(--border); }
    .podium-col { display: flex; flex-direction: column; align-items: center; min-width: 0; cursor: pointer; }
    .podium-col.empty { cursor: default; }
    .podium-person { text-align: center; padding: 0 2px 10px; min-width: 0; width: 100%; }
    .podium-person svg { width: 46px; height: 54px; display: block; margin: 0 auto 8px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35)); }
    .place-1 .podium-person svg { width: 54px; height: 64px; }
    .podium-name { font-weight: 600; font-size: 15px; line-height: 1.25; min-height: 2.5em; display: flex; align-items: flex-end; justify-content: center; overflow-wrap: anywhere; }
    .podium-count { font-size: 27px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .podium-block {
      width: 100%; border-radius: 10px 10px 0 0; text-align: center; color: #1A1A1A; padding-top: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
    }
    .podium-block .rank { font-size: 30px; font-weight: 800; line-height: 1; }
    .podium-block .tier { font-size: 11px; font-weight: 700; letter-spacing: .22em; margin-top: 6px; opacity: .8; }
    .podium-block .share { font-size: 13px; font-weight: 600; margin-top: 6px; opacity: .85; }
    .place-1 .podium-block { height: 150px; background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3)); }
    .place-2 .podium-block { height: 118px; background: linear-gradient(180deg, var(--silver-1), var(--silver-2) 55%, var(--silver-3)); }
    .place-3 .podium-block { height: 96px; background: linear-gradient(180deg, var(--bronze-1), var(--bronze-2) 55%, var(--bronze-3)); }
    .podium-col.empty .podium-block { background: #262F3D; color: var(--faint); box-shadow: none; }
    .podium-col.empty .podium-name, .podium-col.empty .podium-count { color: var(--faint); }
    .podium-col:not(.empty):hover .podium-name { color: var(--blue); }
    .podium-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding-top: 12px; }
    .podium-foot .total { color: var(--teal); font-weight: 500; }

    /* rise-up animation: blocks grow from the floor, then the trophies and names drop in */
    .animate .podium-block { transform-origin: bottom; animation: rise .75s cubic-bezier(.2,.8,.2,1) both; }
    .animate .podium-person { animation: dropIn .55s cubic-bezier(.2,.8,.2,1) both; }
    .animate .place-3 .podium-block { animation-delay: .05s; }
    .animate .place-2 .podium-block { animation-delay: .2s; }
    .animate .place-1 .podium-block { animation-delay: .35s; }
    .animate .place-3 .podium-person { animation-delay: .55s; }
    .animate .place-2 .podium-person { animation-delay: .7s; }
    .animate .place-1 .podium-person { animation-delay: .85s; }
    .animate .place-1 .podium-person svg { animation: shine 1.6s ease-in-out 1.4s both; }
    @keyframes rise { from { transform: scaleY(0); opacity: .4; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes dropIn { from { transform: translateY(-18px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes shine { 0%,100% { transform: none; } 50% { transform: scale(1.08) rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) {
      .animate .podium-block, .animate .podium-person, .animate .place-1 .podium-person svg { animation: none; }
    }

    /* ---------- cards, charts ---------- */
    .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .chart-grid.cols-1 { grid-template-columns: minmax(0, 1fr); }
    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
    .chart-card h4 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .chart-desc { color: var(--muted); font-size: 12px; margin: 5px 0 14px; }
    .chart-box { position: relative; height: 340px; }
    .chart-box.short { height: 280px; }
    .chart-box canvas { cursor: pointer; }
    .chart-empty { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 13px; border: 1px dashed var(--border); border-radius: 10px; }

    .kpi-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 8px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; text-align: left; color: inherit; }
    .kpi-card:hover { border-color: var(--border-strong); }
    .kpi-card .value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .kpi-card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .kpi-card.alert .value { color: var(--amber); }

    /* ---------- tables ---------- */
    .table-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .table-scroll { overflow: auto; max-height: 560px; }
    .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    .data-table th, .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    .data-table thead th { position: sticky; top: 0; background: #1F2735; color: var(--muted); font-weight: 600; font-size: 12px; z-index: 2; }
    .data-table th.num, .data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .data-table .sticky-col { position: sticky; left: 0; background: var(--card); z-index: 1; }
    .data-table thead .sticky-col { z-index: 3; background: #1F2735; }
    .data-table tbody tr:hover td { background: var(--card-hover); }
    .data-table td.clickable { cursor: pointer; color: var(--blue); }
    .data-table td.clickable:hover { text-decoration: underline; }
    .data-table td.zero { color: var(--faint); }
    .data-table tr.region-row td { background: #18202B; color: var(--teal); font-weight: 700; font-size: 11px; letter-spacing: .1em; }
    .data-table tr.total-row td { font-weight: 700; background: #1F2735; }
    .data-table th.current { color: var(--text); }
    .na { color: var(--faint); }
    .att { font-weight: 600; }
    .att.good { color: var(--green); }
    .att.mid { color: var(--amber); }
    .att.low { color: var(--red); }

    .metric-tabs { display: flex; gap: 6px; padding: 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .metric-tabs button { flex-shrink: 0; background: var(--card-alt); border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 500; cursor: pointer; }
    .metric-tabs button:hover { color: var(--text); }
    .metric-tabs button.active { background: rgba(111,168,232,0.16); border-color: var(--blue); color: var(--text); }

    /* ---------- modal ---------- */
    .modal-overlay { position: fixed; inset: 0; background: rgba(5,8,12,0.66); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px; width: min(1040px, 100%); max-height: 86vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .modal-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
    .modal-head h3 { margin: 0; font-size: 18px; font-family: Fraunces, Georgia, serif; }
    .modal-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 26px; line-height: 1; padding: 0 4px; }
    .modal-close:hover { color: var(--text); }
    .modal-tools { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .modal-tools input { background: var(--card-alt); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; min-width: 240px; font-family: inherit; }
    .modal-box .table-scroll { max-height: 58vh; border: 1px solid var(--border); border-radius: 10px; }
    .modal-box a { color: var(--blue); text-decoration: none; }
    .modal-box a:hover { text-decoration: underline; }
    .hint { color: var(--faint); font-size: 12px; margin-top: 10px; }

    @media (max-width: 1280px) {
      .podium-grid { grid-template-columns: 1fr; }
      .podium-card { max-width: 760px; }
    }
    @media (max-width: 980px) {
      .chart-grid { grid-template-columns: 1fr; }
      .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .app { flex-direction: column; }
      .sidebar { width: auto; height: auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; gap: 4px; }
      .brand { margin: 0 12px 0 0; font-size: 16px; }
      .brand small { display: none; }
      .nav-item { width: auto; border-left: 0; border-bottom: 2px solid transparent; padding: 8px 10px; }
      .nav-item.active { border-bottom-color: var(--blue); }
      .sidebar-foot { display: none; }
      .main { padding: 20px 16px 48px; }
      .podium-title { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand">SDR Manager<small>Dashboard</small></div>
      <button class="nav-item" data-page="leaderboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        Leaderboard
      </button>
      <button class="nav-item" data-page="rep-overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        Rep Overview
      </button>
      <button class="nav-item" data-page="actionables">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Actionables
      </button>
      <div class="sidebar-foot">
        <div id="data-as-of">Live from HubSpot</div>
        <button class="btn" id="refresh-btn" title="Pull fresh data from HubSpot (data is otherwise cached for 15 minutes)">↻ Refresh data</button>
      </div>
    </nav>

    <main class="main">
      <!-- LEADERBOARD -->
      <section class="page" id="page-leaderboard">
        <div class="page-header">
          <div>
            <h2>Leaderboard</h2>
            <div class="subtitle" id="lb-subtitle">Loading fiscal year…</div>
          </div>
        </div>
        <div id="lb-content"><div class="loading"><span class="spinner"></span>Loading data from HubSpot…</div></div>
      </section>

      <!-- REP OVERVIEW -->
      <section class="page" id="page-rep-overview">
        <div class="page-header">
          <div>
            <h2>Rep Overview</h2>
            <div class="subtitle" id="ro-subtitle">Input and output metrics per SDR over time</div>
          </div>
          <div class="filters">
            <div class="seg" id="ro-granularity">
              <button data-value="week" class="active">Week on week</button>
              <button data-value="month">Month on month</button>
              <button data-value="quarter">Quarter on quarter</button>
            </div>
            <div class="seg" id="ro-mode">
              <button data-value="region" class="active">Region</button>
              <button data-value="sdr">SDR Name</button>
            </div>
            <select id="ro-region" class="filter-select" aria-label="Region"></select>
            <select id="ro-sdr" class="filter-select" aria-label="SDR" hidden></select>
          </div>
        </div>
        <div id="ro-content"><div class="loading"><span class="spinner"></span>Loading data from HubSpot…</div></div>
      </section>

      <!-- ACTIONABLES -->
      <section class="page" id="page-actionables">
        <div class="page-header">
          <div>
            <h2>Actionables</h2>
            <div class="subtitle">What needs attention right now - current state, not date filtered</div>
          </div>
          <div class="filters">
            <div class="seg" id="ac-mode">
              <button data-value="region" class="active">Region</button>
              <button data-value="sdr">SDR Name</button>
            </div>
            <select id="ac-region" class="filter-select" aria-label="Region"></select>
            <select id="ac-sdr" class="filter-select" aria-label="SDR" hidden></select>
          </div>
        </div>
        <div id="ac-content"><div class="loading"><span class="spinner"></span>Loading data from HubSpot…</div></div>
      </section>
    </main>
  </div>

  <script>
    // ============================= constants =============================
    var REGION_ORDER = ['NAM', 'EMEA', 'APAC'];
    // One stable colour per SDR (by roster position) so a rep keeps their colour across charts.
    var SDR_COLORS = ['#6FA8E8', '#5CC3AE', '#E2B054', '#C792EA', '#E58080', '#7FD1E8', '#A3D977', '#F29E6D', '#9AA8F5', '#E88BC4', '#D4C46A', '#6CC596', '#B39DDB', '#F4C38B'];
    // Sequential ramp for time periods (oldest = lightest) in stacked bars.
    var PERIOD_RAMP = ['#D6E6F8', '#B7D3F2', '#98C0EC', '#79ADE6', '#5A99DE', '#3F84D0', '#2C6DB5', '#1F5694'];
    var QUARTER_COLORS = ['#98C0EC', '#5A99DE', '#2C6DB5', '#1F4F86'];

    var STAGE_LABELS = {
      'qualifiedtobuy': 'Qualified to buy',
      'presentationscheduled': 'Presentation done',
      'decisionmakerboughtin': 'Proposal Shared / Negotiations',
      '10679404': 'Contracting (New Business)',
      'closedwon': 'Closed won',
      'closedlost': 'Closed lost',
      '144930627': 'Scheduled',
      '144930628': 'Sales Accepted Account',
      '198705765': 'No Show/ Cancelled/ Rescheduled',
      '144930629': 'Not Qualified',
      '1422037570': 'Debook',
      '1365874062': 'Deal Desk Verified Closed Won'
    };
    var CHANNEL_LABELS = { called: 'Call', emailed: 'Email', linkedin: 'LinkedIn' };

    // Drill-down table columns per record type. `get` reads a value off a record.
    var COLUMN_DEFS = {
      deal: [
        { key: 'name', label: 'Deal Name', link: 'deal' },

      ],

        { key: 'contacts', label: 'Contacts touched', num: true },
        { key: 'lastTouch', label: 'Last touch in period', date: true }
      ]
    };

    var portalId = null;
    function notePortalId(id) { if (id) portalId = id; }

    // ============================= generic helpers =============================
    function escapeHtml(s) {
      return String(s === undefined || s === null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function sum(list, fn) { return list.reduce(function (s, o) { return s + (fn(o) || 0); }, 0); }
    function formatDate(iso) {
      if (!iso) return '';
      var d = /^\d+$/.test(String(iso)) ? new Date(Number(iso)) : new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function formatTime(iso) {
      var d = new Date(iso);
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }
    function pct(n, d) { return d ? Math.round((n / d) * 100) + '%' : '—'; }
    function errorHtml(err) { return '<div class="error-box">Failed to load data: ' + escapeHtml(err && err.message ? err.message : err) + '</div>'; }
    function loadingHtml(text) { return '<div class="loading"><span class="spinner"></span>' + escapeHtml(text || 'Loading data from HubSpot…') + '</div>'; }
    function infoIcon(text) { return '<span class="info-icon" data-tooltip="' + escapeHtml(text) + '">i</span>'; }
    function hubspotUrl(type, id) {
      if (!portalId || !id) return null;
      var objectTypeId = { contact: '0-1', company: '0-2', deal: '0-3' }[type];
      return 'https://app.hubspot.com/contacts/' + portalId + '/record/' + objectTypeId + '/' + id;
    }

    function apiGet(url) {
      return fetch(url).then(function (r) {
        return r.json().catch(function () { return null; }).then(function (body) {
          if (!r.ok) throw new Error((body && body.message) ? body.message : ('HTTP ' + r.status));
          return body;
        });
      });
    }

    function setDataAsOf(iso) {
      document.getElementById('data-as-of').textContent = 'Data as of ' + formatTime(iso);
    }

    // ---- roster helpers ----
    function ownersList(owners) {
      return Object.keys(owners).map(function (id) { return owners[id]; });
    }
    function colorForOwner(owners, ownerId) {
      var idx = Object.keys(owners).indexOf(ownerId);
      return SDR_COLORS[(idx < 0 ? 0 : idx) % SDR_COLORS.length];
    }
    function regionSort(a, b) {
      var ra = REGION_ORDER.indexOf(a.region), rb = REGION_ORDER.indexOf(b.region);
      return ra !== rb ? ra - rb : a.name.localeCompare(b.name);
    }

    // ============================= charts =============================
    Chart.defaults.color = '#8E99AB';
    Chart.defaults.font.family = 'Inter, -apple-system, sans-serif';
    Chart.defaults.font.size = 12;
    Chart.defaults.borderColor = '#2C3647';
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.legend.labels.boxWidth = 8;
    Chart.defaults.plugins.legend.labels.color = '#C9D1DC';
    Chart.defaults.plugins.tooltip.backgroundColor = '#0A0E13';
    Chart.defaults.plugins.tooltip.borderColor = '#2C3647';
    Chart.defaults.plugins.tooltip.borderWidth = 1;
    Chart.defaults.plugins.tooltip.padding = 10;

    var chartsByGroup = {};
    function trackChart(group, chart) { (chartsByGroup[group] = chartsByGroup[group] || []).push(chart); return chart; }
    function destroyCharts(group) { (chartsByGroup[group] || []).forEach(function (c) { c.destroy(); }); chartsByGroup[group] = []; }

    function axes(stacked, xTitle, yTitle) {
      return {
        x: { stacked: stacked, grid: { display: false }, ticks: { color: '#C9D1DC', maxRotation: 40, autoSkip: false }, title: xTitle ? { display: true, text: xTitle } : undefined },
        y: { stacked: stacked, beginAtZero: true, grid: { color: '#263041' }, ticks: { precision: 0 }, title: yTitle ? { display: true, text: yTitle } : undefined }
      };
    }

    function emptyChart(canvasId, text) {
      var el = document.getElementById(canvasId);
      if (el) el.parentNode.innerHTML = '<div class="chart-empty">' + escapeHtml(text || 'No data for this selection') + '</div>';
    }

    // One line per series across x labels. series: [{ label, color, values[] }]; onPick(seriesIndex, xIndex)
    function lineChart(group, canvasId, xLabels, series, yTitle, onPick) {
      if (!series.length) return emptyChart(canvasId);
      return trackChart(group, new Chart(document.getElementById(canvasId), {
        type: 'line',
        data: {
          labels: xLabels,
          datasets: series.map(function (s) {
            return {
              label: s.label, data: s.values, borderColor: s.color, backgroundColor: s.color,
              borderWidth: 2.5, pointRadius: 4, pointHoverRadius: 7, tension: 0.25
            };
          })
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'nearest', intersect: false },
          plugins: { legend: { position: 'bottom' } },
          scales: axes(false, null, yTitle),
          onClick: function (evt, els) { if (els.length) onPick(els[0].datasetIndex, els[0].index); }
        }
      }));
    }

    // Bars per x label, stacked by series. series: [{ label, color, values[] }]; onPick(seriesIndex, xIndex)
    function stackedBarChart(group, canvasId, xLabels, series, yTitle, onPick) {
      if (!xLabels.length) return emptyChart(canvasId);
      return trackChart(group, new Chart(document.getElementById(canvasId), {
        type: 'bar',
        data: {
          labels: xLabels,
          datasets: series.map(function (s) {
            return { label: s.label, data: s.values, backgroundColor: s.color, borderColor: '#1C2330', borderWidth: { top: 1 }, maxBarThickness: 64 };
          })
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', display: series.length > 1 },
            tooltip: { callbacks: { footer: function (items) {
              if (series.length < 2 || !items.length) return '';
              var i = items[0].dataIndex;
              return 'Total: ' + sum(series, function (s) { return s.values[i]; });
            } } }
          },
          scales: axes(true, null, yTitle),
          onClick: function (evt, els) { if (els.length) onPick(els[0].datasetIndex, els[0].index); }
        }
      }));
    }

    function chartCardHtml(canvasId, title, desc, info, short) {
      return '<div class="chart-card">' +
        '<h4>' + escapeHtml(title) + (info ? infoIcon(info) : '') + '</h4>' +
        '<div class="chart-desc">' + escapeHtml(desc) + '</div>' +
        '<div class="chart-box' + (short ? ' short' : '') + '"><canvas id="' + canvasId + '"></canvas></div>' +
      '</div>';
    }

    // ============================= modals =============================
    // Modals stack: a chart inside a modal can open a records modal on top of it.
    function openModal(title, subtitle, bodyHtml, onMount) {
      var group = 'modal-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML =
        '<div class="modal-box" role="dialog" aria-modal="true">' +
          '<div class="modal-head"><div><h3>' + escapeHtml(title) + '</h3>' +
          (subtitle ? '<div class="modal-sub">' + escapeHtml(subtitle) + '</div>' : '') + '</div>' +
          '<button class="modal-close" aria-label="Close">&times;</button></div>' +
          bodyHtml +
        '</div>';
      function close() {
        destroyCharts(group);
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) {
        if (e.key === 'Escape' && document.querySelector('.modal-overlay:last-of-type') === overlay) close();
      }
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      overlay.querySelector('.modal-close').addEventListener('click', close);
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
      if (onMount) onMount(overlay, group);
      return overlay;
    }

    function cellValue(col, r) {
      var v = col.get ? col.get(r) : r[col.key];
      if (col.date && v) v = formatDate(v);
      return v;
    }

    function recordsTableHtml(records, type) {
      var cols = COLUMN_DEFS[type] || COLUMN_DEFS.deal;
      var head = '<tr>' + cols.map(function (c) { return '<th' + (c.num ? ' class="num"' : '') + '>' + escapeHtml(c.label) + '</th>'; }).join('') + '</tr>';
      var body = records.map(function (r) {
        return '<tr>' + cols.map(function (c) {
          var v = cellValue(c, r);
          var display = escapeHtml(v === undefined || v === null || v === '' ? '—' : v);
          var url = c.link ? hubspotUrl(c.link, r.id) : null;
          if (url) display = '<a href="' + url + '" target="_blank" rel="noopener">' + display + '</a>';
          return '<td' + (c.num ? ' class="num"' : '') + '>' + display + '</td>';
        }).join('') + '</tr>';
      }).join('');
      return '<div class="table-scroll"><table class="data-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    }

    function openRecordsModal(title, records, type) {
      records = records || [];
      var sub = records.length + ' record' + (records.length === 1 ? '' : 's');
      if (!records.length) return openModal(title, sub, '<div class="empty-box">No records match.</div>');
      openModal(title, sub,
        '<div class="modal-tools"><input type="search" placeholder="Filter these records…" aria-label="Filter records">' +
        '<button class="btn" data-csv>Download CSV</button></div><div data-table>' + recordsTableHtml(records, type) + '</div>',
        function (overlay) {
          var input = overlay.querySelector('input[type=search]');
          var holder = overlay.querySelector('[data-table]');
          var cols = COLUMN_DEFS[type] || COLUMN_DEFS.deal;
          function filtered() {
            var q = input.value.trim().toLowerCase();
            if (!q) return records;
            return records.filter(function (r) {
              return cols.some(function (c) { return String(cellValue(c, r) || '').toLowerCase().indexOf(q) !== -1; });
            });
          }
          input.addEventListener('input', function () { holder.innerHTML = recordsTableHtml(filtered(), type); });
          overlay.querySelector('[data-csv]').addEventListener('click', function () {
            var rows = [cols.map(function (c) { return c.label; })].concat(filtered().map(function (r) {
              return cols.map(function (c) { var v = cellValue(c, r); return v === undefined || v === null ? '' : v; });
            }));
            var csv = rows.map(function (row) { return row.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '.csv';
            a.click();
          });
        });
    }

    // ============================= filters (Region / SDR) =============================
    function wireSegmented(id, onChange) {
      var group = document.getElementById(id);
      group.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (btn.classList.contains('active')) return;
          group.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
          onChange(btn.getAttribute('data-value'));
        });
      });
    }

    function wireScopeFilter(prefix, state, onChange) {
      var regionSel = document.getElementById(prefix + '-region');
      var sdrSel = document.getElementById(prefix + '-sdr');
      wireSegmented(prefix + '-mode', function (mode) {
        state.mode = mode;
        regionSel.hidden = mode !== 'region';
        sdrSel.hidden = mode !== 'sdr';
        onChange();
      });
      regionSel.addEventListener('change', function () { state.region = regionSel.value; onChange(); });
      sdrSel.addEventListener('change', function () { state.sdrId = sdrSel.value; onChange(); });
    }

    function populateScopeFilter(prefix, owners, state) {
      var regionSel = document.getElementById(prefix + '-region');
      var sdrSel = document.getElementById(prefix + '-sdr');
      if (!regionSel.options.length) {
        regionSel.innerHTML = '<option value="ALL">All regions</option>' +
          REGION_ORDER.map(function (r) { return '<option value="' + r + '">' + r + '</option>'; }).join('');
      }
      if (!sdrSel.options.length) {
        var list = ownersList(owners).sort(regionSort);
        sdrSel.innerHTML = REGION_ORDER.map(function (region) {
          var inRegion = list.filter(function (o) { return o.region === region; });
          if (!inRegion.length) return '';
          return '<optgroup label="' + region + '">' + inRegion.map(function (o) {
            return '<option value="' + escapeHtml(o.ownerId) + '">' + escapeHtml(o.name) + '</option>';
          }).join('') + '</optgroup>';
        }).join('');
        if (!state.sdrId && list.length) state.sdrId = list[0].ownerId;
      }
      regionSel.value = state.region;
      sdrSel.value = state.sdrId;
    }

    function scopeOwners(state, owners) {
      var list = ownersList(owners).sort(regionSort);
      if (state.mode === 'sdr') return list.filter(function (o) { return o.ownerId === state.sdrId; });
      if (state.region === 'ALL') return list;
      return list.filter(function (o) { return o.region === state.region; });
    }

    function scopeLabel(state, owners) {
      if (state.mode === 'sdr') return owners[state.sdrId] ? owners[state.sdrId].name : '';
      return state.region === 'ALL' ? 'All regions' : state.region;
    }

    // ============================= navigation =============================
    var PAGES = ['leaderboard', 'rep-overview', 'actionables'];
    var loaders = {};
    var loadedPages = {};

    function showPage(page) {
      if (PAGES.indexOf(page) === -1) page = 'leaderboard';
      document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.toggle('active', n.getAttribute('data-page') === page); });
      document.querySelectorAll('.page').forEach(function (p) { p.classList.toggle('active', p.id === 'page-' + page); });
      if (location.hash !== '#' + page) history.replaceState(null, '', '#' + page);
      currentPage = page;
      if (!loadedPages[page]) { loadedPages[page] = true; loaders[page](false); }
    }
    var currentPage = null;
    document.querySelectorAll('.nav-item').forEach(function (item) {
      item.addEventListener('click', function () { showPage(item.getAttribute('data-page')); });
    });
    window.addEventListener('hashchange', function () { showPage(location.hash.slice(1)); });
    document.getElementById('refresh-btn').addEventListener('click', function () { loaders[currentPage](true); });

    // ============================= LEADERBOARD =============================
    var LB_METRICS = [
      {
        key: 'allboundOpps', title: 'Allbound + Outbound Opps Created', unit: 'opps',
        desc: 'Qualified opportunities with Final Lead Source Allbound or Pure Outbound',
        info: 'Deals in the Sales pipeline where SDR Owner (Deal) is the rep, Became Qualified to Buy Date is in this fiscal year, Final Lead Source is Allbound or Pure Outbound, and the deal is in an opportunity stage (Qualified to buy through Closed won/lost, Debook, Deal Desk Verified).'
      },
      {
        key: 'allOpps', title: 'All Opps Created', unit: 'opps',
        desc: 'Qualified opportunities created by the rep, any lead source',
        info: 'Deals in the Sales pipeline where SDR Owner (Deal) is the rep and Became Qualified to Buy Date is in this fiscal year, in an opportunity stage (Qualified to buy through Closed won/lost, Debook, Deal Desk Verified).'
      },
      {
        key: 'meetings', title: 'Meetings Booked', unit: 'meetings',
        desc: 'Deals that entered the Scheduled stage, excluding Junk Leads',
        info: 'Deals in the Sales pipeline where SDR Owner (Deal) is the rep and the date the deal entered Scheduled is in this fiscal year. Deals disqualified as Junk Lead are excluded.'
      }
    ];
    var lbData = null;

    loaders.leaderboard = function (refresh) {
      document.getElementById('lb-content').innerHTML = loadingHtml();
      apiGet('/api/leaderboard' + (refresh ? '?refresh=1' : ''))
        .then(function (data) { lbData = data; notePortalId(data.portalId); setDataAsOf(data.generatedAt); renderLeaderboard(); })
        .catch(function (err) { document.getElementById('lb-content').innerHTML = errorHtml(err); });
    };

    function countBy(records, keyFn) {
      var out = {};
      records.forEach(function (r) { var k = keyFn(r); out[k] = (out[k] || 0) + 1; });
      return out;
    }

    // Reps in `region` with at least one record, ranked by count (ties alphabetical).
    function rankRegion(metricKey, region) {
      var counts = countBy(lbData.metrics[metricKey], function (r) { return r.ownerId; });
      return ownersList(lbData.owners)
        .filter(function (o) { return o.region === region && counts[o.ownerId]; })
        .map(function (o) { return { owner: o, count: counts[o.ownerId] }; })
        .sort(function (a, b) { return b.count - a.count || a.owner.name.localeCompare(b.owner.name); });
    }

    function recordsFor(metricKey, ownerId, quarterNumber) {
      return lbData.metrics[metricKey].filter(function (r) {
        return (!ownerId || r.ownerId === ownerId) && (!quarterNumber || r.quarterNumber === quarterNumber);
      });
    }

    function trophySvg(tier, uid) {
      var stops = {
        gold: ['#F6E7A8', '#D9B24A', '#9C7621'],
        silver: ['#F1F3F6', '#BCC3CD', '#7A828E'],
        bronze: ['#EBC59C', '#BF8A5C', '#80553A']
      }[tier];
      var id = 'tg-' + uid;
      return '<svg viewBox="0 0 64 76" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="' + stops[0] + '"/><stop offset=".55" stop-color="' + stops[1] + '"/><stop offset="1" stop-color="' + stops[2] + '"/></linearGradient></defs>' +
        '<g fill="url(#' + id + ')">' +
          '<path d="M14 4h36v6c0 13-6.5 23-18 25C20.5 33 14 23 14 10V4z"/>' +
          '<path d="M14 9H5v4c0 8 5 13 12 14l-1.5-4.6C11.6 21.4 9.5 18.3 9.5 13.5V13H14V9zM50 9h9v4c0 8-5 13-12 14l1.5-4.6c3.9-1 6-4.1 6-8.9V13H50V9z"/>' +
          '<rect x="28" y="34" width="8" height="14" rx="1.5"/>' +
          '<rect x="20" y="48" width="24" height="7" rx="2.5"/>' +
          '<rect x="14" y="58" width="36" height="9" rx="3"/>' +
        '</g><path d="M21 9c0 9 2.6 15.5 7 19" stroke="#fff" stroke-opacity=".45" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
    }

    function podiumColHtml(entry, place, regionTotal, uid) {
      var tier = ['gold', 'silver', 'bronze'][place - 1];
      var tierLabel = tier.toUpperCase();
      if (!entry) {
        return '<div class="podium-col empty place-' + place + '">' +
          '<div class="podium-person">' + trophySvg(tier, uid).replace('<svg ', '<svg style="opacity:.18" ') +
          '<div class="podium-name">—</div><div class="podium-count">—</div></div>' +
          '<div class="podium-block"><div class="rank">' + place + '</div><div class="tier">' + tierLabel + '</div></div></div>';
      }
      return '<div class="podium-col place-' + place + '" data-owner="' + escapeHtml(entry.owner.ownerId) + '" title="See ' + escapeHtml(entry.owner.name) + '\'s deals">' +
        '<div class="podium-person">' + trophySvg(tier, uid) +
          '<div class="podium-name">' + escapeHtml(entry.owner.name) + '</div>' +
          '<div class="podium-count" data-count="' + entry.count + '">' + entry.count + '</div>' +
        '</div>' +
        '<div class="podium-block"><div class="rank">' + place + '</div><div class="tier">' + tierLabel + '</div>' +
          '<div class="share">' + pct(entry.count, regionTotal) + ' of team</div></div>' +
      '</div>';
    }

    function podiumCardHtml(metric, region) {
      var ranked = rankRegion(metric.key, region);
      var total = sum(ranked, function (e) { return e.count; });
      var uid = metric.key + '-' + region;
      return '<div class="podium-card" data-metric="' + metric.key + '" data-region="' + region + '">' +
        '<div class="podium-head"><div>' +
          '<button class="podium-title" data-action="compare" title="Open the ' + region + ' rep-wise comparison"><span class="hash">#</span> ' + escapeHtml(metric.title) + '</button> ' + infoIcon(metric.info) +
          '<div class="podium-sub"><span class="region-pill">' + region + '</span>' + escapeHtml(lbData.fyLabel) + ' to date</div>' +
        '</div><button class="link-btn" data-action="ranking">View full ranking →</button></div>' +
        '<div class="podium">' +
          podiumColHtml(ranked[1], 2, total, uid + '-2') +
          podiumColHtml(ranked[0], 1, total, uid + '-1') +
          podiumColHtml(ranked[2], 3, total, uid + '-3') +
        '</div>' +
        '<div class="podium-foot"><span>' + ranked.length + ' Sales Development Rep' + (ranked.length === 1 ? '' : 's') + ' ranked</span>' +
          '<span class="total">' + region + ' total: ' + total + ' ' + metric.unit + '</span></div>' +
      '</div>';
    }

    function renderLeaderboard() {
      var d = lbData;
      document.getElementById('lb-subtitle').textContent = d.fyLabel + ' fiscal year to date (from 1 May) · top 3 reps per region';

      var html = '';
      LB_METRICS.forEach(function (m) {
        html += '<div class="section-heading"><h3>' + escapeHtml(m.title) + '</h3></div>';
        html += '<div class="section-desc">' + escapeHtml(m.desc) + '. Click a title to compare every rep in that region, or a rep to see their deals.</div>';
        html += '<div class="podium-grid animate">' + REGION_ORDER.map(function (r) { return podiumCardHtml(m, r); }).join('') + '</div>';
      });

      html += '<div class="section-heading"><h3>SDR Performance</h3>' + infoIcon('Achieved = Allbound + Outbound SQLs (same deals as the first leaderboard), counted in the fiscal quarter of their Became Qualified to Buy Date. Targets are hard-coded in data/team.js. Allbound + Outbound SQLs are the only metric with a target.') + '</div>';
      html += '<div class="section-desc">Allbound + Outbound SQLs: target vs achieved and attainment, per quarter of ' + escapeHtml(d.fyLabel) + '. Click an achieved number to see the deals.</div>';
      html += sdrPerformanceHtml();

      var root = document.getElementById('lb-content');
      root.innerHTML = html;

      root.querySelectorAll('.podium-count[data-count]').forEach(function (el) { countUp(el, Number(el.getAttribute('data-count'))); });
      root.querySelectorAll('.podium-card').forEach(function (card) {
        var metric = LB_METRICS.filter(function (m) { return m.key === card.getAttribute('data-metric'); })[0];
        var region = card.getAttribute('data-region');
        card.querySelector('[data-action=compare]').addEventListener('click', function () { openComparisonModal(metric, region); });
        card.querySelector('[data-action=ranking]').addEventListener('click', function () { openRankingModal(metric, region); });
        card.querySelectorAll('.podium-col[data-owner]').forEach(function (col) {
          col.addEventListener('click', function () {
            var o = lbData.owners[col.getAttribute('data-owner')];
            openRecordsModal(o.name + ' — ' + metric.title + ' (' + lbData.fyLabel + ')', recordsFor(metric.key, o.ownerId), 'deal');
          });
        });
      });
      root.querySelectorAll('td[data-perf-owner]').forEach(function (td) {
        td.addEventListener('click', function () {
          var o = lbData.owners[td.getAttribute('data-perf-owner')];
          var q = Number(td.getAttribute('data-perf-q')) || null;
          openRecordsModal(o.name + ' — Allbound + Outbound opps, ' + (q ? 'Q' + q + ' ' : '') + lbData.fyLabel, recordsFor('allboundOpps', o.ownerId, q), 'deal');
        });
      });
    }

    function countUp(el, target) {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || target <= 0) { el.textContent = target; return; }
      var delay = 600, duration = 900, t0 = null;
      el.textContent = '0';
      function frame(t) {
        if (t0 === null) t0 = t;
        var p = Math.min(1, Math.max(0, (t - t0 - delay) / duration));
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // Title click: every rep in the region, one bar each, split by fiscal quarter - same records as the podium.
    function openComparisonModal(metric, region) {
      var ranked = rankRegion(metric.key, region);
      var quarters = lbData.quarters.filter(function (q) { return q.quarterNumber <= lbData.currentQuarterNumber; });
      openModal(metric.title + ' — ' + region + ' rep-wise comparison', lbData.fyLabel + ' to date · ' + metric.desc,
        '<div class="chart-box"><canvas id="cmp-canvas"></canvas></div><div class="hint">Click a bar segment to see the deals behind it.</div>',
        function (overlay, group) {
          var canvas = overlay.querySelector('#cmp-canvas');
          canvas.id = group + '-canvas';
          stackedBarChart(group, canvas.id, ranked.map(function (e) { return e.owner.name; }), quarters.map(function (q, i) {
            return {
              label: q.label, color: QUARTER_COLORS[i % QUARTER_COLORS.length],
              values: ranked.map(function (e) { return recordsFor(metric.key, e.owner.ownerId, q.quarterNumber).length; })
            };
          }), metric.unit, function (si, xi) {
            var e = ranked[xi], q = quarters[si];
            openRecordsModal(e.owner.name + ' — ' + metric.title + ', ' + q.label, recordsFor(metric.key, e.owner.ownerId, q.quarterNumber), 'deal');
          });
        });
    }

    // "View full ranking": every rep ranked with a per-quarter breakdown, plus all the underlying deals.
    function openRankingModal(metric, region) {
      var ranked = rankRegion(metric.key, region);
      var total = sum(ranked, function (e) { return e.count; });
      var quarters = lbData.quarters.filter(function (q) { return q.quarterNumber <= lbData.currentQuarterNumber; });
      var regionRecords = lbData.metrics[metric.key].filter(function (r) { return lbData.owners[r.ownerId] && lbData.owners[r.ownerId].region === region; });

      var html = '<div class="table-scroll" style="max-height:none;margin-bottom:14px"><table class="data-table"><thead><tr><th>#</th><th>SDR</th>' +
        quarters.map(function (q) { return '<th class="num">' + escapeHtml(q.label) + '</th>'; }).join('') +
        '<th class="num">Total</th><th class="num">% of ' + region + '</th></tr></thead><tbody>';
      ranked.forEach(function (e, i) {
        html += '<tr><td>' + (i + 1) + '</td><td>' + escapeHtml(e.owner.name) + '</td>' +
          quarters.map(function (q) {
            var n = recordsFor(metric.key, e.owner.ownerId, q.quarterNumber).length;
            return '<td class="num' + (n ? ' clickable' : ' zero') + '" data-o="' + e.owner.ownerId + '" data-q="' + q.quarterNumber + '">' + n + '</td>';
          }).join('') +
          '<td class="num clickable" data-o="' + e.owner.ownerId + '" data-q="">' + e.count + '</td><td class="num">' + pct(e.count, total) + '</td></tr>';
      });
      if (!ranked.length) html += '<tr><td colspan="' + (quarters.length + 4) + '" class="na">No ' + metric.unit + ' yet this fiscal year.</td></tr>';
      html += '</tbody></table></div>';
      html += '<button class="btn" data-all>Show all ' + regionRecords.length + ' underlying deals</button>';

      openModal(metric.title + ' — ' + region + ' full ranking', lbData.fyLabel + ' to date · ' + metric.desc, html, function (overlay) {
        overlay.querySelectorAll('td[data-o]').forEach(function (td) {
          if (td.classList.contains('zero')) return;
          td.addEventListener('click', function () {
            var o = lbData.owners[td.getAttribute('data-o')];
            var q = Number(td.getAttribute('data-q')) || null;
            openRecordsModal(o.name + ' — ' + metric.title + (q ? ', Q' + q : '') + ' ' + lbData.fyLabel, recordsFor(metric.key, o.ownerId, q), 'deal');
          });
        });
        overlay.querySelector('[data-all]').addEventListener('click', function () {
          openRecordsModal(region + ' — ' + metric.title + ' (' + lbData.fyLabel + ')', regionRecords, 'deal');
        });
      });
    }

    function sdrPerformanceHtml() {
      var d = lbData;
      var targetsApply = d.targetsFiscalYear === d.fyLabel;
      var achieved = {};
      d.metrics.allboundOpps.forEach(function (r) {
        achieved[r.ownerId] = achieved[r.ownerId] || {};
        achieved[r.ownerId][r.quarterNumber] = (achieved[r.ownerId][r.quarterNumber] || 0) + 1;
      });
      function targetOf(id, qn) {
        var t = targetsApply && d.targets[id] ? d.targets[id]['q' + qn] : null;
        return t === null || t === undefined || t === '' ? null : Number(t);
      }
      // Leave out reps with no target and nothing achieved all year (e.g. someone who has left).
      var rows = ownersList(d.owners).sort(regionSort).filter(function (o) {
        return [1, 2, 3, 4].some(function (qn) { return targetOf(o.ownerId, qn) !== null || (achieved[o.ownerId] || {})[qn]; });
      });

      var html = '<div class="table-card"><div class="table-scroll"><table class="data-table"><thead><tr><th class="sticky-col">SDR</th>';
      [1, 2, 3, 4].forEach(function (qn) {
        var cur = qn === d.currentQuarterNumber ? ' current' : '';
        html += '<th class="num' + cur + '">Q' + qn + ' Target</th><th class="num' + cur + '">Q' + qn + ' Achieved</th><th class="num' + cur + '">Q' + qn + ' Attainment</th>';
      });
      html += '<th class="num">FY Target</th><th class="num">FY Achieved</th><th class="num">FY Attainment</th></tr></thead><tbody>';

      REGION_ORDER.forEach(function (region) {
        var inRegion = rows.filter(function (o) { return o.region === region; });
        if (!inRegion.length) return;
        html += '<tr class="region-row"><td class="sticky-col">' + region + '</td><td colspan="15"></td></tr>';
        inRegion.forEach(function (o) {
          var fyT = 0, fyHasT = false, fyA = 0;
          html += '<tr><td class="sticky-col">' + escapeHtml(o.name) + '</td>';
          [1, 2, 3, 4].forEach(function (qn) {
            var t = targetOf(o.ownerId, qn);
            var a = (achieved[o.ownerId] || {})[qn] || 0;
            if (t !== null) { fyT += t; fyHasT = true; }
            fyA += a;
            html += '<td class="num">' + (t === null ? '<span class="na">N/A</span>' : t) + '</td>' +
              '<td class="num' + (a ? ' clickable' : ' zero') + '"' + (a ? ' data-perf-owner="' + o.ownerId + '" data-perf-q="' + qn + '"' : '') + '>' + a + '</td>' +
              '<td class="num">' + attainmentHtml(a, t) + '</td>';
          });
          html += '<td class="num">' + (fyHasT ? fyT : '<span class="na">N/A</span>') + '</td>' +
            '<td class="num' + (fyA ? ' clickable' : ' zero') + '"' + (fyA ? ' data-perf-owner="' + o.ownerId + '" data-perf-q=""' : '') + '>' + fyA + '</td>' +
            '<td class="num">' + attainmentHtml(fyA, fyHasT ? fyT : null) + '</td></tr>';
        });
      });
      if (!rows.length) html += '<tr><td colspan="16" class="na">No targets or Allbound + Outbound opportunities yet.</td></tr>';
      html += '</tbody></table></div></div>';
      if (!targetsApply) html += '<div class="hint">Targets in data/team.js are for ' + escapeHtml(d.targetsFiscalYear) + ', so they are not shown against ' + escapeHtml(d.fyLabel) + '.</div>';
      return html;
    }

    function attainmentHtml(achieved, target) {
      if (target === null || target === undefined) return '<span class="na">—</span>';
      if (!target) return '<span class="na">—</span>';
      var p = achieved / target;
      var cls = p >= 1 ? 'good' : p >= 0.7 ? 'mid' : 'low';
      return '<span class="att ' + cls + '">' + Math.round(p * 100) + '%</span>';
    }

    // ============================= REP OVERVIEW =============================
    var RO_METRICS = [

      { key: 'warm', group: 'accounts', type: 'account', chart: 'line', title: 'Warm accounts with activity', unit: 'Accounts',
        desc: 'Accounts tagged Warm (any tag containing "Warm", plus Surging Accounts) with SDR outreach in the period.',
        info: 'Companies whose TAGS- SDR Categories contains "Warm" (Warm Accounts, Strategic Warm Accounts, Warm Event Accounts) or is Surging Accounts, counted in each period in which the SDR reached out to one of their own contacts there.' },
      { key: 'event', group: 'accounts', type: 'account', chart: 'line', title: 'Event accounts with activity', unit: 'Accounts',
        desc: 'Accounts tagged with an Event category with SDR outreach in the period.',
        info: 'Companies whose TAGS- SDR Categories contains "Event" (Warm Event Accounts, Cold Event Accounts), counted in each period in which the SDR reached out to one of their own contacts there.' }
    ];
    var RO_PREFIX = { week: 'Week on week', month: 'Month on month', quarter: 'Quarter on quarter' };
    var roData = {};
    var roState = { granularity: 'week', mode: 'region', region: 'ALL', sdrId: null, tableMetric: 'reached' };
    var roRequest = 0;

    wireSegmented('ro-granularity', function (g) { roState.granularity = g; loaders['rep-overview'](false); });
    wireScopeFilter('ro', roState, renderRepOverview);

    loaders['rep-overview'] = function (refresh) {
      var g = roState.granularity;
      if (roData[g] && !refresh) { renderRepOverview(); return; }
      var req = ++roRequest;
      document.getElementById('ro-content').innerHTML = loadingHtml('Loading ' + RO_PREFIX[g].toLowerCase() + ' activity from HubSpot… the first load can take a minute.');
      apiGet('/api/rep-overview?granularity=' + g + (refresh ? '&refresh=1' : ''))
        .then(function (data) {
          roData[g] = data;
          if (req !== roRequest) return; // a newer granularity was picked meanwhile
          notePortalId(data.portalId);
          setDataAsOf(data.generatedAt);
          populateScopeFilter('ro', data.owners, roState);
          renderRepOverview();
        })
        .catch(function (err) { if (req === roRequest) document.getElementById('ro-content').innerHTML = errorHtml(err); });
    };

    // Rows (contacts / accounts / deals) behind one metric, for one SDR and one period.
    function roRows(data, metric, ownerId, periodKey) {
      var byOwner = data[metric.group][metric.key][ownerId] || {};
      var rows = byOwner[periodKey] || [];
      var owner = data.owners[ownerId];
      if (metric.type === 'contact') {
        return rows.map(function (r) {
          var c = data.contacts[r.id] || {};
          return { id: r.id, name: c.name, email: c.email, companyName: c.companyName || c.companyDomain, sdrOwner: owner.name, channels: r.channels, lastTouch: r.lastTouch };
        });
      }
      if (metric.type === 'account') {
        return rows.map(function (r) {
          var c = data.companies[r.id] || {};
          return { id: r.id, name: c.name, domain: c.domain, tagCategory: c.tagCategory, sdrOwner: owner.name, contacts: r.contacts, lastTouch: r.lastTouch };
        });
      }
      return rows;
    }
    function roCount(data, metric, ownerId, periodKey) {
      return ((data[metric.group][metric.key][ownerId] || {})[periodKey] || []).length;
    }

    function renderRepOverview() {
      var data = roData[roState.granularity];
      if (!data) return;
      destroyCharts('ro');
      var scope = scopeOwners(roState, data.owners);
      var periods = data.periods;
      var prefix = RO_PREFIX[roState.granularity];
      var periodWord = { week: 'week', month: 'month', quarter: 'quarter' }[roState.granularity];

      document.getElementById('ro-subtitle').textContent = scopeLabel(roState, data.owners) + ' · ' +
        periods[0].label + ' – ' + periods[periods.length - 1].label + ' · data as of ' + formatTime(data.generatedAt);

      var html = '';
      (data.warnings || []).forEach(function (w) { html += '<div class="warning-box">' + escapeHtml(w) + '</div>'; });

      function card(m) {
        var desc = m.desc + (m.chart === 'line' ? ' One line per SDR.' : ' One bar per SDR, split by ' + periodWord + '.');

      html += '<div class="section-heading"><h3>Outreach</h3></div><div class="section-desc">Contacts each SDR reached out to.</div>';
      html += '<div class="chart-grid">' + RO_METRICS.filter(function (m) { return m.group === 'activity'; }).map(card).join('') + '</div>';
      html += '<div class="section-heading"><h3>Meetings &amp; opportunities</h3></div><div class="section-desc">Deals where the rep is SDR Owner (Deal).</div>';
      html += '<div class="chart-grid">' + RO_METRICS.filter(function (m) { return m.group === 'deals'; }).map(card).join('') + '</div>';
      html += '<div class="section-heading"><h3>Accounts with activity</h3></div><div class="section-desc">Tagged accounts the SDR worked in each ' + periodWord + '.</div>';
      html += '<div class="chart-grid">' + RO_METRICS.filter(function (m) { return m.group === 'accounts'; }).map(card).join('') + '</div>';

      html += '<div class="section-heading"><h3>Compare in a table</h3></div>';

      }).join('') + '</div><div id="ro-table"></div></div>';

      document.getElementById('ro-content').innerHTML = html;

      RO_METRICS.forEach(function (m) {
        // Leave out SDRs with no data for this metric.
        var active = scope.filter(function (o) { return periods.some(function (p) { return roCount(data, m, o.ownerId, p.key); }); });

          }), m.unit, function (si, xi) { pick(active[si], periods[xi]); });
        } else {

          stackedBarChart('ro', 'ro-chart-' + m.key, active.map(function (o) { return o.name; }), periods.map(function (p, i) {
            return { label: p.label, color: ramp[i], values: active.map(function (o) { return roCount(data, m, o.ownerId, p.key); }) };

    // ============================= ACTIONABLES =============================
    var AC_ACCOUNT_CHARTS = [
      { key: 'thirdParty', title: '3rd party intent accounts not worked', color: '#E58080',

    var acState = { mode: 'region', region: 'ALL', sdrId: null };
    wireScopeFilter('ac', acState, renderActionables);

    loaders.actionables = function (refresh) {
      document.getElementById('ac-content').innerHTML = loadingHtml();
      apiGet('/api/actionables' + (refresh ? '?refresh=1' : ''))
        .then(function (data) {
          acData = data; notePortalId(data.portalId); setDataAsOf(data.generatedAt);
          populateScopeFilter('ac', data.owners, acState);
          renderActionables();
        })
        .catch(function (err) { document.getElementById('ac-content').innerHTML = errorHtml(err); });
    };

    // One bar per SDR (highest first), SDRs at zero left out. valueFn(owner) -> records[]
    function perRepBarChart(canvasId, scope, color, label, recordsFn, title, type) {
      var rows = scope.map(function (o) { return { owner: o, records: recordsFn(o) }; })
        .filter(function (r) { return r.records.length; })
        .sort(function (a, b) { return b.records.length - a.records.length; });
      stackedBarChart('ac', canvasId, rows.map(function (r) { return r.owner.name; }),
        [{ label: label, color: color, values: rows.map(function (r) { return r.records.length; }) }], label,
        function (si, xi) { openRecordsModal(rows[xi].owner.name + ' — ' + title, rows[xi].records, type); });
    }

    function renderActionables() {
      if (!acData) return;
      destroyCharts('ac');
      var scope = scopeOwners(acState, acData.owners);
      var a = acData.accounts, s = acData.stuck;
      var sl = scopeLabel(acState, acData.owners);

      var html = '<div class="kpi-row">';
      AC_ACCOUNT_CHARTS.forEach(function (c) {
        var n = sum(scope, function (o) { return (a[c.key][o.ownerId] || []).length; });
        html += '<button class="kpi-card' + (n ? ' alert' : '') + '" data-kpi="' + c.key + '"><div class="value">' + n + '</div><div class="label">' + escapeHtml(c.title) + '</div></button>';
      });
      html += '</div>';

      html += '<div class="section-heading"><h3>Accounts to work</h3></div><div class="section-desc">' + escapeHtml(sl) + ' · reps with nothing outstanding are left out of each chart.</div>';
      html += '<div class="chart-grid">' + AC_ACCOUNT_CHARTS.map(function (c) { return chartCardHtml('ac-chart-' + c.key, c.title, c.desc + ' Click a bar for the list.', c.info, true); }).join('') + '</div>';

      html += '<div class="section-heading"><h3>Where deals are stuck</h3></div><div class="section-desc">Deals currently sitting in a stage, by SDR Owner (Deal).</div>';
      html += '<div class="chart-grid cols-1">' +
        chartCardHtml('ac-chart-noshow', 'No Shows', 'Deals currently in No Show / Cancelled / Rescheduled, split by whether they have been worked since.', 'Deals currently in stage No Show/ Cancelled/ Rescheduled, split by Worked after No Show?.', true) +
        chartCardHtml('ac-chart-mql', 'MQLs (Scheduled)', 'Deals in the Scheduled stage for 30+ days.', 'Deals currently in stage Scheduled, bucketed by days since they entered it: 30-59, 60-89, 90+.', true) +
        chartCardHtml('ac-chart-saa', 'Sales Accepted (SAA)', 'Deals in the Sales Accepted Account stage for 30+ days.', 'Deals currently in stage Sales Accepted Account, bucketed by days since they entered it: 30-59, 60-89, 90+.', true) +
      '</div>';

      document.getElementById('ac-content').innerHTML = html;

      document.querySelectorAll('[data-kpi]').forEach(function (el) {
        el.addEventListener('click', function () {
          var c = AC_ACCOUNT_CHARTS.filter(function (x) { return x.key === el.getAttribute('data-kpi'); })[0];
          var recs = scope.reduce(function (acc, o) { return acc.concat(a[c.key][o.ownerId] || []); }, []);
          openRecordsModal(sl + ' — ' + c.title, recs, 'company');
        });
      });

      AC_ACCOUNT_CHARTS.forEach(function (c) {
        perRepBarChart('ac-chart-' + c.key, scope, c.color, 'Accounts', function (o) { return a[c.key][o.ownerId] || []; }, c.title, 'company');
      });

      // No shows: worked vs not worked
      var noShowTotal = function (o) { var d = s.noShow[o.ownerId]; return d ? d.worked.length + d.notWorked.length : 0; };
      var ns = scope.filter(noShowTotal).sort(function (x, y) { return noShowTotal(y) - noShowTotal(x); });
      stackedBarChart('ac', 'ac-chart-noshow', ns.map(function (o) { return o.name; }), [
        { label: 'Not worked', color: '#E58080', values: ns.map(function (o) { return s.noShow[o.ownerId].notWorked.length; }) },
        { label: 'Worked', color: '#5CC3AE', values: ns.map(function (o) { return s.noShow[o.ownerId].worked.length; }) }
      ], 'Deals', function (si, xi) {
        var o = ns[xi], key = si === 0 ? 'notWorked' : 'worked';
        openRecordsModal(o.name + ' — No Shows, ' + (si === 0 ? 'not worked' : 'worked'), s.noShow[o.ownerId][key], 'deal');
      });

      var buckets = [
        { key: 'over30', label: '30-59 days', color: '#E2B054' },
        { key: 'over60', label: '60-89 days', color: '#F29E6D' },
        { key: 'over90', label: '90+ days', color: '#E58080' }
      ];
      [['mql', 'MQLs stuck in Scheduled'], ['saa', 'stuck in Sales Accepted']].forEach(function (pair) {
        var byOwner = s[pair[0]];
        var total = function (o) { var d = byOwner[o.ownerId]; return d ? sum(buckets, function (b) { return d[b.key].length; }) : 0; };
        var list = scope.filter(total).sort(function (x, y) { return total(y) - total(x); });
        stackedBarChart('ac', 'ac-chart-' + pair[0], list.map(function (o) { return o.name; }), buckets.map(function (b) {
          return { label: b.label, color: b.color, values: list.map(function (o) { return byOwner[o.ownerId][b.key].length; }) };
        }), 'Deals', function (si, xi) {
          var o = list[xi], b = buckets[si];
          openRecordsModal(o.name + ' — ' + pair[1] + ' ' + b.label, byOwner[o.ownerId][b.key], 'stuckDeal');
        });
      });
    }

    // ============================= boot =============================
    showPage(location.hash.slice(1) || 'leaderboard');
  </script>
</body>
</html>
